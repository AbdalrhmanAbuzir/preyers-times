<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aladhan timer</title>
  <link rel="stylesheet" href="aladhan.css">
</head>
<body>
  <script src="node_modules/axios/dist/axios.min.js"></script>
  <!-- the flex container -->
  <div class="container">
    <!-- body section -->
    <div class="body">
      <!-- the header inside the body -->
      <div class="header">
        <div class="logo">اوقات الاذان</div>
        <div class="dd">
          <div class="day"></div>
          <div class="date"></div>
        </div>    
      </div>
      <!-- the contant inside the body -->
      <div class="contant-container">
        <div class="contant">
            <div class="p">
              <p>ان الصلاة كانت على المؤمنين كتابا موقتا</p>
              <p></p>
            </div>
          <div class="prayers">
            <div class="Fajr">
              <h2 class="pray">صلاة الفجر</h2>
              <p class="time"></p>              
            </div>
            <div class="sunrise">
              <h2 class="pray">الشروق</h2>
              <p class="time"></p>    
            </div>
            <div class="Dhuhr">
              <h2 class="pray">صلاة الظهر</h2>
              <p class="time"></p>    
            </div>
            <div class="asr">
              <h2 class="pray">صلاة العصر</h2>
              <p class="time"></p>    
            </div>
            <div class="maghrib">
              <h2 class="pray">صلاة المغرب</h2>
              <p class="time"></p>    
            </div>
            <div class="isha">
              <h2 class="pray">صلاة العشاء</h2>
              <p class="time"></p>    
            </div>
          </div>
        </div>
        <div>
          <!-- <p style="padding: 20px;">created by abd alrhman abuzir</p> -->
        </div>
      </div>
    </div>
    <!-- side bar section -->
    <!-- out side the body -->
    <div class="sidebar">
      <div class="palestine" title="palestine" name="فلسطين"><img src="flag-icons-main/flags/4x3/ps.svg" alt=""></div>
      <div class="jordan" title="jordan" name="الاردن"><img src="flag-icons-main/flags/4x3/jo.svg" alt=""></div>
      <div class="qatar" title="qatar" name="قطر"><img src="flag-icons-main/flags/4x3/qa.svg" alt=""></div>
      <div class="saudi-arabia" title="saudi-arabia" name="سعودية"><img src="flag-icons-main/flags/4x3/sa.svg" alt=""></div>
      <div class="syria" title="syria" name="سوريا"><img src="flag-icons-main/flags/4x3/sy.svg" alt=""></div>
      <div class="yemen" title="yemen" name="اليمن"><img src="flag-icons-main/flags/4x3/ye.svg" alt=""></div>
      <div class="sudan" title="sudan" name="السودان"><img src="flag-icons-main/flags/4x3/sd.svg" alt="" ></div>
    </div>
  </div>  
    <script src="aladhan.js"></script>
</body>
</html>
